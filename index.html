<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C0NQHLVE3C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-C0NQHLVE3C');
  </script>
  
  <meta charset="utf-8" />
  <title>Chess.com Move-Time Visualizer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="title-row">
    <h1>Chess Move-Time</h1>
    <div class="controls-input-group title-row-controls">
      <input id="username" type="text" aria-label="Chess.com username" placeholder="chess.com username" value="" />
      <button id="loadGamesBtn"><span class="btn-full">Load recent games</span><span class="btn-short">Load</span></button>
    </div>
  </div>
  <div class="controls-stack">
    <span id="status" class="small"></span>
    <div class="controls-row game-select-row">
      <select id="gamesSelect">
        <option value="">Load a user first</option>
      </select>
    </div>
  </div>

  <div class="layout">
    <div class="moves-panel">
      <div class="moves-list" id="movesList">Load a user and choose a game to see moves and durations.</div>
      <div class="move-navigation" aria-label="Move navigation">
        <button id="prevMoveBtn" type="button" aria-label="Previous move">←</button>
        <button id="nextMoveBtn" type="button" aria-label="Next move">→</button>
      </div>
    </div>

    <div class="board-panel">
      <div class="board-wrap">
        <table id="board" class="board" aria-label="Chessboard"></table>
        <svg class="svg-overlay" id="svgOverlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      </div>
      <div id="capturedPieces" class="captured-pieces" aria-label="Captured pieces"></div>
    </div>
  </div>

  <!-- chess.js from CDN (UMD build that exposes global `Chess`) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    // quick runtime check to help debugging if CDN build doesn't expose Chess
    if (typeof Chess === 'undefined' && typeof window !== 'undefined' && typeof window.Chess === 'undefined') {
      console.error('Chess library not loaded: Chess is undefined. Check the chess.js script include.');
    }
  </script>
  <script src="utils.js"></script>
  <script src="board.js"></script>
  <script src="app.js"></script>
</body>
</html>
